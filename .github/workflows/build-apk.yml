name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version line: $JAVA_VERSION_OUTPUT"
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -nE 's/.*version "([0-9]+)(\.[0-9]+)*.*".*/\1/p')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect the active Java major version." >&2
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_MAJOR) is lower than the required Java 17." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore found."
          else
            echo "Generating temporary ./debug.keystore..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created or is empty." >&2
            exit 1
          fi
          echo "Confirmed ./debug.keystore is present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk for discovered APK paths:" >&2
              find app/build/outputs/apk -type f -name "*.apk" >&2 || true
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file." >&2
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty." >&2
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have the .apk extension." >&2
              exit 1
              ;;
          esac
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK path ($EXPECTED_APK) does not match app/build/outputs/apk/debug/app-debug.apk." >&2
            exit 1
          fi
          echo "Verified debug APK at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "Error: Verified APK is missing or empty at $SOURCE_APK" >&2
            exit 1
          fi
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_DIR="${RUNNER_TEMP}/apk-release-asset-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RELEASE_ASSET_DIR"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_FILENAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH" >&2
            exit 1
          fi
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_FILENAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset is not a .apk file: $ASSET_PATH"
              exit 1
              ;;
          esac
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          ### Automatically Generated Debug APK

          - **Build System:** Built automatically by GitHub Actions
          - **GitHub Actions Run Number:** \`${GITHUB_RUN_NUMBER}\`
          - **GitHub Actions Run Attempt:** \`${GITHUB_RUN_ATTEMPT}\`
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Purpose:** Intended for testing only (not a Play Store production release)
          - **Signing:** Signed only with a temporary debug keystore
          EOF
          )
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$PUBLISH_OUTCOME" = "success" ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            echo "GitHub Release published successfully!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **Build & Artifact Upload:** Succeeded"
              echo "- **GitHub Release Publishing:** Succeeded"
              echo "- **Release Title:** \`$RELEASE_TITLE\`"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo "- **Direct GitHub Release Page URL:** [$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "You can download \`$ASSET_NAME\` directly onto your phone from the **Assets** section on the GitHub Release page above."
              echo "The normal GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed, but the debug APK build and GitHub Actions artifact upload succeeded."
            echo "The debug APK build succeeded and the GitHub Actions artifact named 'app-debug-apk' remains available for download from this workflow run."
            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "> **Warning:** GitHub Release publishing failed or was skipped."
              echo ""
              echo "- **APK Build Result:** Succeeded"
              echo "- **GitHub Actions Artifact:** Available (\`app-debug-apk\`)"
              echo "- **GitHub Release Status:** Failed"
              echo ""
              echo "### Backup Download Instructions"
              echo "Open the summary page of this GitHub Actions workflow run and download the **\`app-debug-apk\`** artifact from the **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
